name: Sync Artwork from Google Drive

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-artwork
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Sync artwork from Google Drive
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: |
          python scripts/sync_drive_artwork.py

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Mat Matera (Drive Sync)"
            git config user.email "matmatera@gmail.com"
            git add assets/art/ artwork.html index.html
            git commit -m "Auto-publish new artwork from Google Drive"
            git push origin main
          else
            echo "No new artwork changes to commit."
          fi
